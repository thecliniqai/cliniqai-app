project_id = "clinicos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
# Signups are off until owner signup returns in V2-13b (AUTH-07); seeds use admin.createUser (01-06 ruling R1).
enable_signup = false
# Server-side password minimum, matching the client schema (AR-L6; pulled forward from AUTH-02).
minimum_password_length = 10

[auth.email]
# Keeps the email provider (password sign-in) on; user creation is governed by [auth] enable_signup above.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# The 6-digit recovery code is valid for 10 minutes, not the default hour (AR-L6).
otp_expiry = 600

# Recovery is code-only: the email carries the 6-digit {{ .Token }} and no link (AUTH-04a, 01-06 ruling R2).
[auth.email.template.recovery]
subject = "Your ClinicOS password reset code"
content_path = "./supabase/templates/recovery.html"
