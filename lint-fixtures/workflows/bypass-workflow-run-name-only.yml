# Fixture (V2-04 04-07c, review C L-2; the shape of backup-alert.yml before 04-07c): a workflow_run job that trusts the
# triggering run by workflow name, branch and "not pull_request" only. A fork PR's workflow named "Staging backup"
# failing under pull_request_review, from a fork branch named feature/v2, satisfies it -> workflow-run-pinned (path,
# head repository and schedule/dispatch event all missing).
name: Fixture workflow_run by name
on:
  workflow_run:
    workflows: [Staging backup]
    types: [completed]
permissions:
  contents: read
jobs:
  report-failure:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_branch == 'feature/v2' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - run: echo "fixture"
