# PR + push lane (V2-02 plan 02-01, P0-11; TEST_STRATEGY §8). Job names are the required-check names of the
# `feature-v2-ci` ruleset: static, security, test, build, e2e. Keep them stable.
#
# Rules for this file (rulings RL-2, RL-8):
# - no repository secrets, no pull_request_target: every lane runs on the local Supabase stack's demo keys and
#   offline providers; fork PRs see nothing sensitive;
# - GITHUB_TOKEN is read-only (top-level `permissions`), checkout does not persist credentials;
# - every `uses:` is pinned to a full commit SHA with the release tag in a comment (repo policy
#   sha_pinning_required). To bump: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (dereference annotated tags via
#   `gh api repos/<owner>/<repo>/git/tags/<sha>`), release at least two weeks old.
name: CI

on:
  # All base branches, so stacked phase PRs (into v2/** branches, OA-2) and PRs into feature/v2 both run.
  pull_request:
  push:
    branches: [feature/v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to feature/v2 always finish (their results are merge evidence).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the migration gate needs the base branch and the merge base
      - name: No env files besides the template and the local-stack test defaults
        run: node scripts/ci/assert-no-env-files.mjs
      # V2-03 03-03 (B2, R-4): applied migrations are immutable; new ones continue the zero-padded sequence.
      # 03-13b: `--base auto` = the PR base, or on a push the commit before the push (so a push to feature/v2 is
      # checked too); `--against` fails when a new migration's number is taken on (or not above) feature/v2.
      - name: Migration immutability (vs the PR base or the pre-push commit; no number collision with feature/v2)
        run: node scripts/ci/migration-immutability.mjs --base auto --against origin/feature/v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (app tsconfig.json + tests tsconfig.tests.json)
        run: npm run typecheck
      - name: No doc-grep tests (TEST_STRATEGY §9.6)
        run: node scripts/ci/assert-no-doc-grep-tests.mjs
      - name: Lint (errors fail; warnings reported)
        run: npm run lint
      - name: Server-action inventory (F14; exits 1 on any flag)
        run: npm run inventory -- --out inventory.json
      - name: AI-06 L1 policy checks
        run: npm run ci:ai-l1
      - name: UI policy (DESIGN_SYSTEM §10; report mode, enforced rules fail)
        run: npm run ci:ui-policy -- --summary "$GITHUB_STEP_SUMMARY"
      # V2-03 03-01 (I-07, R-15): .env.example is generated from lib/env.ts; this compares without printing it.
      - name: .env.example matches the env schema
        run: node scripts/ci/env-example.mjs --check
      # V2-03 03-11a (AUTH-02): supabase/config.toml [auth] matches the local column of supabase/auth-policy.json;
      # templates are code-only. The hosted (staging) half is scripts/drift/auth-config-hosted.mjs in drift.yml (03-08).
      - name: Auth config matches the auth policy
        run: node scripts/ci/check-auth-config.mjs
      # V2-03 03-08 (R-9, R-19, R-21; T-03-09), hardened 03-13b: SHA-pinned actions, top-level permissions, no
      # write-all; staging workflows: push/schedule/dispatch triggers only, read-only token, staging secrets only in a
      # step's env of a job with an `environment`; privileged jobs: no cache, `--ignore-scripts`, checkout without
      # persisted credentials; no untrusted `${{ }}` in run:; no secrets dump; non-block YAML fails closed.
      - name: Workflow policy (.github/workflows)
        run: node scripts/ci/workflow-policy.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: inventory
          path: inventory.json
          if-no-files-found: warn
          retention-days: 14

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit gate (production deps, high/critical, expiring allowlist)
        run: npm run ci:audit
      - name: npm registry signatures and provenance
        run: npm audit signatures
      - name: Install pinned gitleaks (checksum-verified)
        run: scripts/ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
      - name: gitleaks (full history)
        run: >-
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --no-banner --config .gitleaks.toml
          --report-format sarif --report-path gitleaks.sarif .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn
          retention-days: 14

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the local Supabase stack (same services as npm run test:db)
        # IR-F8: image pulls hit registry rate limits; retry with cleanup and backoff (bounded: 3 attempts).
        run: >-
          node scripts/ci/retry.mjs --attempts 3 --delay 30 --cleanup "npx supabase stop --no-backup"
          -- npx supabase start -x studio,edge-runtime,logflare,vector,imgproxy,supavisor
      # V2-03 03-03 (B4): types/database.ts is what `npm run db:types` generates from the freshly migrated stack.
      - name: Generated types are fresh (npm run db:types, then no diff)
        run: npm run db:types && git diff --exit-code -- types/database.ts
      # V2-03 03-03: migrations are deterministic: the migrated stack equals a shadow built from supabase/migrations
      # (migra; only the documented pg_net CLI false positive is allowed). This compares the migrations with themselves.
      - name: Migrations are deterministic (supabase db diff --local)
        run: node scripts/ci/local-drift.mjs
      # V2-03 03-13b (M-DRIFT; B1 local half): the freshly migrated stack equals the committed schema + privilege
      # snapshot (scripts/drift/schema-snapshot.txt: public/ops/private, policies, RLS, grants to anon/authenticated/
      # service_role/PUBLIC). A migration ships its regenerated snapshot, so every grant/policy change is reviewed.
      - name: Schema and privileges match the committed snapshot
        run: node scripts/drift/schema-snapshot.mjs --local --check
      # V2-04 04-05a: tests/ops/backup-roundtrip-db.spec.ts runs ops/backup/backup.sh with the pinned age release and
      # the digest-pinned postgres/aws-cli images (ops/bin/pins.env); install and pull them before the lane.
      - name: Backup tools (pinned age release, pinned images)
        run: |
          ops/bin/install-age.sh
          # shellcheck disable=SC2016 # the variables expand in the inner `bash -c`, after pins.env is sourced
          node scripts/ci/retry.mjs --attempts 3 --delay 30 -- bash -c '. ops/bin/pins.env && docker pull -q "$POSTGRES_IMAGE" && docker pull -q "$AWS_CLI_IMAGE"'
      # V2-05 05-01a: `supabase test db` runs pg_prove in this image; the tag is the one the pinned Supabase CLI
      # (package.json "supabase": "2.120.0") pulls, so bump it with the CLI. Only the image pull is retried.
      - name: Pre-pull pg_prove
        run: node scripts/ci/retry.mjs --attempts 3 --delay 30 -- docker pull -q public.ecr.aws/supabase/pg_prove:3.36
      # V2-05 05-01a (P1-01): every supabase/tests/database/*.test.sql file against the migrated stack
      # (scripts/test-pgtap.mjs: `supabase test db --local`, TAP teed to the report). Never retried: a test that passes
      # only on retry is a defect.
      - name: pgTAP (RLS matrix and constraints)
        run: npm run test:pgtap -- pgtap-report.tap
      - name: pgTAP report gate (0 not ok, 0 SKIP/TODO, every plan complete, total >= floor, required files)
        if: ${{ !cancelled() }}
        run: node scripts/ci/assert-pgtap-report.mjs pgtap-report.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: pgtap-report
          path: pgtap-report.tap
          if-no-files-found: warn
          retention-days: 14
      # One run produces both the JSON report and v8 coverage (02-05); coverage is report-only until V2-14.
      - name: Vitest (full unit + DB lane, with coverage)
        run: npx vitest run --reporter=dot --reporter=json --outputFile.json=vitest-report.json --coverage.enabled
      - name: Report gate (0 failed, 0 skipped/todo, total >= floor)
        if: ${{ !cancelled() }}
        run: node scripts/ci/assert-vitest-report.mjs vitest-report.json
      - name: Coverage summary (report only, never fails)
        if: ${{ !cancelled() }}
        run: node scripts/ci/coverage-summary.mjs coverage/coverage-summary.json
      # V2-03 03-05 (P1-21): the clinic-date helpers must not depend on the process zone. The runner is UTC, so the
      # main run cannot catch a local-zone use; this re-runs the spec in a zone that is neither UTC nor IST.
      - name: Clinic-date spec under TZ=America/New_York
        if: ${{ !cancelled() }}
        run: TZ=America/New_York npx vitest run tests/utils/datetime.spec.ts
      # P0-13 (02-02 step 5): copies lint-fixtures/p0-13/unguarded-action.ts into features/, requires
      # tests/security/guard-actions.spec.ts to FAIL naming it, and always deletes the copy.
      - name: P0-13 canary (an unguarded server action must fail the guard spec)
        if: ${{ !cancelled() }}
        run: node scripts/ci/guard-canary.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: vitest-report
          path: vitest-report.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the local stack
        if: ${{ always() }}
        run: npx supabase stop --no-backup

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'features/**', 'lib/**', 'proxy.ts', 'instrumentation.ts', 'next.config.ts', 'postcss.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # V2-03 03-01 (R-11, K-6): a production build with offline providers is the `ci` tier of the env schema
      # (loopback URLs only); next.config.ts refuses the build if any tier rule breaks.
      - name: next build (production, APP_ENV=ci, loopback Supabase URL, placeholder key, offline messaging)
        run: npm run build
        env:
          NODE_ENV: production
          APP_ENV: ci
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder-not-a-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          MESSAGING_PROVIDER: dev
      # V2-06 06-07 (P2-02, PWA_STRATEGY §3.9, R-5): first-load JS per app route from the Turbopack manifests, gzip -9.
      # Report-only: budgets in scripts/ci/route-js-budgets.json never fail this job (V2-15 adds --enforce). Exit 2 (a
      # manifest or chunk missing from the build) does fail it: the build output is broken.
      - name: Route JS report (report-only)
        run: node scripts/ci/route-js.mjs --out route-js --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: route-js
          path: route-js/
          if-no-files-found: error
          retention-days: 14

  # Playwright PR lane (02-03a; RL-16, RL-20): desktop-chrome (all specs), pixel-7 (all but the viewport-owning a11y
  # specs), iphone-15 (@golden). The checkout has no .env by construction; the app server is built and served only
  # through the guarded `e2e:build` / `serve.ts` path on 127.0.0.1:3100.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      # Only the engines the PR lane uses (Chromium for desktop-chrome/pixel-7, WebKit for iphone-15). OS packages are
      # not cached, so `install-deps` always runs; the browser download is skipped on a cache hit.
      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install browser OS dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'features/**', 'lib/**', 'proxy.ts', 'instrumentation.ts', 'next.config.ts', 'postcss.config.mjs') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Start the local Supabase stack (same services as npm run test:db)
        # IR-F8: image pulls hit registry rate limits; retry with cleanup and backoff (bounded: 3 attempts).
        run: >-
          node scripts/ci/retry.mjs --attempts 3 --delay 30 --cleanup "npx supabase stop --no-backup"
          -- npx supabase start -x studio,edge-runtime,logflare,vector,imgproxy,supavisor
      - name: e2e build (guarded env, output marker scan, build stamp)
        run: npm run e2e:build
      - name: Playwright PR lane
        run: npm run e2e:pr
      - name: Run summary (retried and failed tests; report only)
        if: ${{ !cancelled() }}
        run: node scripts/ci/playwright-summary.mjs playwright-report/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-pr
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the local stack
        if: ${{ always() }}
        run: npx supabase stop --no-backup
