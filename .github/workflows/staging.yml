# Staging deploy lane (V2-03 plan 03-08; P1-35a, FT-01; rulings R-9, R-19, R-21, R-26). Runbook: docs/runbooks/staging.md.
#
# The staging app deploys through the Vercel Git integration on feature/v2 (R-26). This workflow applies the
# migrations to the staging database and then waits until the deployment whose /api/health `release` equals this
# commit answers /api/ready with the repository's newest migration ("staging deploys from CI").
#
# Rules for this file (checked by scripts/ci/workflow-policy.mjs in the `static` job):
# - never runs on pull_request / pull_request_target / workflow_run: PR code never sits next to staging credentials;
# - every job that touches staging declares `environment: staging` (required reviewer = the PO, deployment branch
#   feature/v2 only), and also checks the ref itself; agents never dispatch this workflow (R-9);
# - secrets live only in the `env` of the single step that needs them, never at job or workflow level; `npm ci` runs
#   with `--ignore-scripts` and no npm cache restore in these jobs (no install script or restored cache runs next to
#   a staging secret);
# - the GITHUB_TOKEN is read-only, checkout does not persist credentials, every `uses:` is pinned to a commit SHA;
# - migrations go through `supabase db push --db-url` (never link state, never --include-seed); every database URL is
#   checked by scripts/staging/target-guard.mjs first, which also masks the password for the rest of the job. The CLI
#   gets the URL re-serialised by the guard (`--print-db-url`: no query parameter that could re-target pgx, TLS
#   required), never the raw secret (03-13 M-GUARD).
# - the AUTH-00 re-check (03-12c, task `recheck`) runs scripts/staging/auth00-recheck.ts: synthetic users only (created
#   and deleted by the kit), one burst of at most 40 password grants, read-only catalogue queries; its JSON report is
#   uploaded as an artifact and holds no key, password, code or token.
name: Staging

on:
  push:
    branches: [feature/v2]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      task:
        description: "migrate = apply supabase/migrations, then wait for the release; seed = create or refresh the synthetic demo clinic; seed-reset = remove it; recheck = AUTH-00 hosted re-check (03-12c)"
        type: choice
        options: [migrate, seed, seed-reset, recheck]
        default: migrate
      captcha_browser_check:
        description: "recheck only: result of your browser sign-in on staging with the live Turnstile widget (PO action E7)"
        type: choice
        options: [not-recorded, passed, failed]
        default: not-recorded
      auth_log_retention:
        description: "recheck only: how long the Auth logs keep failed sign-ins, as the dashboard shows it (e.g. 1 day)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # One staging change at a time; a running migration is never cancelled.
  group: staging
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  migrate:
    name: migrate
    if: ${{ github.ref == 'refs/heads/feature/v2' && (github.event_name == 'push' || inputs.task == 'migrate') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm ci (no install scripts; the Supabase CLI comes from its platform package)
        run: npm ci --ignore-scripts
      - name: Target guard (the staging project only; masks the database password)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          SUPABASE_PROJECT_REF_STAGING: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
        run: node scripts/staging/target-guard.mjs --var STAGING_DB_URL --mask
      - name: Migrations that would be applied (dry run)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          SUPABASE_PROJECT_REF_STAGING: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
          PGSSLMODE: require
        run: |
          DB_URL="$(node scripts/staging/target-guard.mjs --var STAGING_DB_URL --print-db-url)"
          npx supabase db push --db-url "$DB_URL" --dry-run
      - name: Apply the migrations
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          SUPABASE_PROJECT_REF_STAGING: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
          PGSSLMODE: require
        run: |
          DB_URL="$(node scripts/staging/target-guard.mjs --var STAGING_DB_URL --print-db-url)"
          npx supabase db push --db-url "$DB_URL" --yes
      - name: Wait for the release on staging, then readiness at the newest migration
        env:
          STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/staging/wait-for-release.mjs "$STAGING_ORIGIN" "$RELEASE_SHA"

  seed:
    name: seed
    if: ${{ github.ref == 'refs/heads/feature/v2' && github.event_name == 'workflow_dispatch' && (inputs.task == 'seed' || inputs.task == 'seed-reset') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm ci (no install scripts)
        run: npm ci --ignore-scripts
      # scripts/seed-staging.ts refuses unless APP_ENV=staging, the URL is https://<staging ref>.supabase.co, the key
      # is an sb_secret_ key and the password has at least 16 characters. It never prints the key or the password.
      - name: Synthetic demo clinic (seed or reset)
        env:
          APP_ENV: staging
          SUPABASE_PROJECT_REF_STAGING: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
          STAGING_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF_STAGING }}.supabase.co
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          STAGING_SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
          TASK: ${{ inputs.task }}
        run: |
          if [ "$TASK" = "seed-reset" ]; then
            npx tsx scripts/seed-staging.ts --reset
          else
            npx tsx scripts/seed-staging.ts
          fi

  auth00-recheck:
    name: auth00-recheck
    if: ${{ github.ref == 'refs/heads/feature/v2' && github.event_name == 'workflow_dispatch' && inputs.task == 'recheck' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm ci (no install scripts)
        run: npm ci --ignore-scripts
      - name: Target guard (the staging database only; masks the database password)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          SUPABASE_PROJECT_REF_STAGING: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
        run: node scripts/staging/target-guard.mjs --var STAGING_DB_URL --mask
      # scripts/staging/auth00-recheck.ts refuses unless this is GitHub Actions on feature/v2 with APP_ENV=staging, the
      # API URL and database are the staging project's, and both keys are hosted sb_ keys. It prints statuses only.
      - name: AUTH-00 re-check (synthetic users, created and deleted by the kit)
        env:
          APP_ENV: staging
          SUPABASE_PROJECT_REF_STAGING: ${{ vars.SUPABASE_PROJECT_REF_STAGING }}
          STAGING_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF_STAGING }}.supabase.co
          STAGING_PUBLISHABLE_KEY: ${{ vars.STAGING_PUBLISHABLE_KEY }}
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          PO_CAPTCHA_BROWSER_CHECK: ${{ inputs.captcha_browser_check }}
          PO_AUTH_LOG_RETENTION: ${{ inputs.auth_log_retention }}
        run: npx tsx scripts/staging/auth00-recheck.ts --target staging --out auth00-recheck-report.json
      - name: Upload the report (statuses and codes only)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth00-recheck-report
          path: auth00-recheck-report.json
          if-no-files-found: warn
          retention-days: 90
